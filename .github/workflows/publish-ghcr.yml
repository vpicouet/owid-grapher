name: Publish OWID Grapher Image (GHCR)

on:
  push:
    branches:
      - modern-societies-customizations

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.scaleway
          push: true
          tags: |
            ghcr.io/vpicouet/owid-grapher:latest
            ghcr.io/vpicouet/owid-grapher:${{ github.sha }}
